AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Add GET and POST /settings routes to an existing API Gateway HTTP API (v2),
  proxying to a Lambda that implements settings_handler.lambda_handler.

Parameters:
  HttpApiId:
    Type: String
    Description: HTTP API id from the invoke URL hostname (e.g. 9jzbd9a34j)
  SettingsLambdaArn:
    Type: String
    Description: Full ARN of the settings Lambda function

Resources:
  SettingsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref SettingsLambdaArn
      PayloadFormatVersion: '2.0'

  SettingsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SettingsLambdaArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*/*/*

  SettingsRouteGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: GET /settings
      Target: !Sub integrations/${SettingsIntegration}

  SettingsRoutePost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: POST /settings
      Target: !Sub integrations/${SettingsIntegration}

Outputs:
  SettingsIntegrationId:
    Description: Integration id (for debugging)
    Value: !Ref SettingsIntegration
  SettingsGetRouteId:
    Value: !Ref SettingsRouteGet
  SettingsPostRouteId:
    Value: !Ref SettingsRoutePost
