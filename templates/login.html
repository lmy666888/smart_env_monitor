<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Environment Monitoring System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <main class="login-page">
        <div class="login-card">
            <h1>Smart Environment Monitoring System</h1>
            <p class="subtitle">Administrator Login</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="warning-banner normal">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% if error %}
                <div class="warning-banner error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('pages.login') }}" class="settings-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" required autofocus>

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required>
                </div>

                <button type="submit">Login</button>
            </form>

            <p class="card-note" style="margin-top:16px;">
                Demo credentials: <code>admin</code> / <code>admin123</code>
            </p>
        </div>
    </main>
</body>
</html>
